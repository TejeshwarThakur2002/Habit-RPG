name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing in CI writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs; the comment shows the release.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history, so a secret committed and later removed is still found.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need a write token; findings still fail the job and show in the log.
          GITLEAKS_ENABLE_COMMENTS: false

  supabase:
    name: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the services the database tests need; skipping the rest saves minutes per run.
      - run: >-
          pnpm exec supabase start
          -x studio,mailpit,logflare,vector,imgproxy,storage-api,edge-runtime,supavisor

      # Applies every migration and the seed from scratch, so a broken migration fails the PR.
      - run: pnpm exec supabase db reset

      # Edge Functions run on Deno; the copy of game-core they import must match packages/ (D5).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - run: pnpm functions:check

      # Served by the CLI rather than `supabase start`'s edge runtime: there the database URL's
      # host (supabase_db_<project>) has an underscore that Deno's resolver refuses (D36).
      # Ready once the gateway answers 401 for a call without a token.
      - name: Serve Edge Functions
        run: |
          pnpm exec supabase functions serve > functions.log 2>&1 &
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/sync || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 2
          done
          cat functions.log
          exit 1

      - run: pnpm functions:test

      - if: failure()
        run: cat functions.log || true

      # pgTAP tests in supabase/tests: the schema rules and Row Level Security (section 9.6).
      - run: pnpm exec supabase test db

      - if: always()
        run: pnpm exec supabase stop --no-backup
