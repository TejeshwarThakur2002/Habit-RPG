# Brings the app to onboarding step 1 with no hero, whatever an earlier run left behind:
# signs out of any hero, then starts a local one. A run stopped mid-onboarding is already there.
appId: host.exp.Exponent
---
# A hero left for days may have fainted at day close; its dialog covers the tabs (F4).
- runFlow:
    when:
      visible: 'You fainted!'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Quests tab'
    commands:
      # Settings by its link: after a cold start Expo Go's floating tools button sits on top of
      # the Stats gear and takes the tap.
      - openLink: exp://127.0.0.1:8095/--/modal/settings
      - scrollUntilVisible:
          element: 'Leave the demo|Sign out'
      - tapOn: 'Leave the demo|Sign out'
      # The alert's action shares its label with the button behind it; it sits right of Cancel.
      - tapOn:
          text: 'Leave|Sign out'
          rightOf: 'Cancel'
- extendedWaitUntil:
    visible: 'Start without an account|Step 1 of 3'
    timeout: 15000
- runFlow:
    when:
      visible: 'Start without an account'
    commands:
      - tapOn: 'Start without an account'
